name: Cypress E2E (parallel)

# Runs the full BDD suite on Linux (matches the WSL reference environment),
# parallelised across 3 machines via Cypress Cloud (--record --parallel).
# Cypress Cloud balances the .feature specs across the containers automatically.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast, single-run gate — no need to type-check once per container.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npx tsc --noEmit

  e2e:
    needs: typecheck
    runs-on: ubuntu-latest
    # Parallel workers. All containers in one run share the same ci-build-id,
    # so Cypress Cloud groups them and splits the specs between them.
    strategy:
      fail-fast: false
      matrix:
        # Add/remove numbers to scale the parallelism (must stay a plain list).
        containers: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run E2E suite (record + parallel)
        run: npm run cy:run:parallel -- --group "e2e-linux" --ci-build-id "${{ github.run_id }}-${{ github.run_attempt }}"
        env:
          # Set this secret in the repo: Settings → Secrets and variables → Actions.
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          # Optional: override the projectId from cypress.config.ts without editing it.
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}

      - name: Upload Cucumber reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-${{ matrix.containers }}
          path: cypress/reports/
          if-no-files-found: ignore

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.containers }}
          path: cypress/screenshots/
          if-no-files-found: ignore
