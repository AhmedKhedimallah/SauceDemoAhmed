name: "Cypress E2E (gated: smoke -> regression -> e2e, parallel specs per stage)"

# Runs the BDD suite on Linux (matches the WSL reference environment) as three
# GATED stages, each recorded to Cypress Cloud (project n75tme):
#   1. smoke       — critical happy-path. If it fails, nothing else runs.
#   2. regression  — full functional coverage. Runs only if smoke passed.
#   3. endtoend    — full user journeys. Runs only if regression passed.
# Gating is enforced with `needs:` — a stage starts only when its prerequisite
# succeeded. Within each stage, specs are split across 2 parallel containers via
# a matrix + `cypress run --record --parallel`; all containers of a stage share
# one ci-build-id so Cypress Cloud load-balances specs between them and groups
# the stage under a single run (groups: smoke-linux / regression-linux / e2e-linux).
# Requires the CYPRESS_RECORD_KEY secret (Settings -> Secrets and variables -> Actions).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast, single-run gate before any browser work.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npx tsc --noEmit

  smoke:
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run @smoke (gate, parallel container ${{ matrix.container }})
        run: npm run cy:run:parallel -- --env tags="@smoke" --group "smoke-linux" --ci-build-id "${{ github.run_id }}-${{ github.run_attempt }}"
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

      - name: Upload Cucumber reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-smoke-${{ matrix.container }}
          path: cypress/reports/
          if-no-files-found: ignore

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-smoke-${{ matrix.container }}
          path: cypress/screenshots/
          if-no-files-found: ignore

  regression:
    # Runs ONLY if smoke passed.
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run @regression (parallel container ${{ matrix.container }})
        run: npm run cy:run:parallel -- --env tags="@regression" --group "regression-linux" --ci-build-id "${{ github.run_id }}-${{ github.run_attempt }}"
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

      - name: Upload Cucumber reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-regression-${{ matrix.container }}
          path: cypress/reports/
          if-no-files-found: ignore

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-regression-${{ matrix.container }}
          path: cypress/screenshots/
          if-no-files-found: ignore

  endtoend:
    # Runs ONLY if regression passed.
    needs: regression
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run @endtoend (parallel container ${{ matrix.container }})
        run: npm run cy:run:parallel -- --env tags="@endtoend" --group "e2e-linux" --ci-build-id "${{ github.run_id }}-${{ github.run_attempt }}"
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

      - name: Upload Cucumber reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-endtoend-${{ matrix.container }}
          path: cypress/reports/
          if-no-files-found: ignore

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-endtoend-${{ matrix.container }}
          path: cypress/screenshots/
          if-no-files-found: ignore
