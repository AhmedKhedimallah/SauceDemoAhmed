name: "Cypress E2E (gated: smoke -> regression -> e2e)"

# Runs the BDD suite on Linux (matches the WSL reference environment) as three
# GATED stages (no Cypress Cloud recording — runs locally on the runner):
#   1. smoke       — critical happy-path. If it fails, nothing else runs.
#   2. regression  — full functional coverage. Runs only if smoke passed.
#   3. endtoend    — full user journeys. Runs only if regression passed.
# Gating is enforced with `needs:` — a stage starts only when its prerequisite
# succeeded. Cucumber reports and failure screenshots are kept as artifacts.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast, single-run gate before any browser work.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npx tsc --noEmit

  smoke:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run @smoke (gate)
        run: npm run cy:run -- --env tags="@smoke"

      - name: Upload Cucumber reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-smoke
          path: cypress/reports/
          if-no-files-found: ignore

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-smoke
          path: cypress/screenshots/
          if-no-files-found: ignore

  regression:
    # Runs ONLY if smoke passed.
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run @regression
        run: npm run cy:run -- --env tags="@regression"

      - name: Upload Cucumber reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-regression
          path: cypress/reports/
          if-no-files-found: ignore

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-regression
          path: cypress/screenshots/
          if-no-files-found: ignore

  endtoend:
    # Runs ONLY if regression passed.
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run @endtoend
        run: npm run cy:run -- --env tags="@endtoend"

      - name: Upload Cucumber reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-endtoend
          path: cypress/reports/
          if-no-files-found: ignore

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-endtoend
          path: cypress/screenshots/
          if-no-files-found: ignore
